<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buat twibbon PT Putera Jaya Sakti Perkasa dengan foto kamu sendiri.">
    <title>Twibbon PJSP ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #198754; /* diganti otomatis sesuai warna twibbon */
            --accent-soft: color-mix(in srgb, var(--accent) 12%, white);
            --accent-dark: color-mix(in srgb, var(--accent) 70%, black);
            --text: #1d2330;
            --muted: #667085;
            --border: #e6e8ec;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 50%),
                linear-gradient(160deg, var(--accent-dark), #111827) fixed;
        }

        main {
            width: 100%;
            max-width: 540px;
            padding: 24px;
            text-align: center;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(16, 24, 40, 0.22);
        }

        .brand {
            display: inline-block;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            border-radius: 999px;
        }

        h1 {
            margin: 8px 0 12px;
            font-size: clamp(19px, 5vw, 24px);
            line-height: 1.3;
            color: var(--accent-dark);
        }

        .steps {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 14px;
            margin-bottom: 18px;
            list-style: none;
            font-size: 13px;
            color: var(--muted);
            counter-reset: step;
        }

        .steps li::before {
            counter-increment: step;
            content: counter(step);
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            margin-right: 6px;
            font-size: 12px;
            background: var(--border);
            border-radius: 50%;
        }

        .steps li.done::before {
            color: #fff;
            background: var(--accent);
        }

        .stage {
            aspect-ratio: 1;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: repeating-conic-gradient(#f2f4f7 0% 25%, #fff 0% 50%) 50% / 24px 24px;
            touch-action: none; /* Cegah scroll/zoom browser saat menyentuh kanvas */
        }

        .stage.has-photo { cursor: grab; }
        .stage.dragging { cursor: grabbing; }
        .stage.drop-target { outline: 3px dashed var(--accent); outline-offset: -8px; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .status {
            min-height: 1.5em;
            margin: 10px 0 14px;
            font-size: 13px;
            color: var(--muted);
        }

        .status.error { color: #b42318; }

        fieldset {
            border: none;
        }

        .zoom {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .zoom input {
            flex: 1;
            accent-color: var(--accent);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 18px;
            font: inherit;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, filter 0.2s;
        }

        .btn:hover:enabled { transform: translateY(-1px); filter: brightness(0.95); }
        .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        .btn:disabled, .zoom input:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand, .btn {
            color: var(--accent-dark);
            background: var(--accent-soft);
        }

        .btn-primary {
            grid-column: 1 / -1;
            color: #fff;
            background: var(--accent);
        }

        .btn-round {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
        }

        footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 400px) {
            main { padding: 16px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">PT PUTERA JAYA SAKTI PERKASA</div>
        <h1 id="title">Twibbon</h1>
        <ol class="steps" id="steps">
            <li>Pilih Foto</li>
            <li>Atur Posisi</li>
            <li>Unduh</li>
        </ol>

        <div class="stage" id="stage">
            <canvas id="canvas" aria-label="Pratinjau twibbon"></canvas>
        </div>
        <p class="status" id="status" role="status">Memuat twibbon…</p>

        <input type="file" id="upload" accept="image/*" hidden>

        <fieldset id="controls" disabled>
            <div class="zoom">
                <button class="btn btn-round" id="zoomOutBtn" aria-label="Perkecil">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
                </button>
                <input type="range" id="zoomSlider" min="0" max="1" step="0.001" aria-label="Ukuran foto">
                <button class="btn btn-round" id="zoomInBtn" aria-label="Perbesar">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
        </fieldset>

        <div class="actions">
            <button class="btn" id="uploadBtn">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                <span id="uploadText">Pilih Foto</span>
            </button>
            <button class="btn" id="resetBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                Atur Ulang
            </button>
            <button class="btn btn-primary" id="downloadBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                Unduh Twibbon
            </button>
        </div>
    </main>

    <footer>&copy; PT Putera Jaya Sakti Perkasa</footer>

    <script>
        // --- Twibbon yang sedang dipakai ---
        // Kalau ada twibbon baru: taruh file PNG-nya di folder ini, lalu ganti
        // `src` dan `title` di bawah. Warna halaman diambil otomatis dari gambar;
        // isi `accent` (mis. "#c8102e") hanya kalau ingin menentukan warnanya sendiri.
        const TWIBBON = {
            src: "TWIBBON_LEBARAN_PJSP_2026.png",
            title: "Hari Raya Idul Fitri 1447H",
            accent: null
        };

        const SIZE = 1080;          // resolusi hasil unduhan (px)
        const CENTER = { x: SIZE / 2, y: SIZE / 2 };
        const MIN_ZOOM = 0.2;       // relatif terhadap ukuran "pas penuh"
        const MAX_ZOOM = 5;
        const ZOOM_STEP = 1.1;

        const $ = (id) => document.getElementById(id);
        const canvas = $("canvas");
        const ctx = canvas.getContext("2d");
        const stage = $("stage");
        const upload = $("upload");
        const slider = $("zoomSlider");
        canvas.width = canvas.height = SIZE;

        let frame = null;           // gambar twibbon
        let photo = null;           // foto pengguna
        let fitScale = 1;           // skala saat foto pas memenuhi kanvas
        const view = { x: 0, y: 0, scale: 1 };

        // --- Tampilan ---
        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);
            if (photo) {
                ctx.drawImage(photo, view.x, view.y, photo.naturalWidth * view.scale, photo.naturalHeight * view.scale);
            }
            if (frame) ctx.drawImage(frame, 0, 0, SIZE, SIZE);
        }

        function setStatus(message, isError = false) {
            $("status").textContent = message;
            $("status").classList.toggle("error", isError);
        }

        function setStep(done) {
            $("steps").querySelectorAll("li").forEach((li, i) => li.classList.toggle("done", i < done));
        }

        function updateControls() {
            $("controls").disabled = $("resetBtn").disabled = !photo;
            $("downloadBtn").disabled = !(photo && frame);
        }

        // --- Twibbon & warna aksen ---
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // Ambil warna paling dominan yang cukup "berwarna" dari twibbon, lalu
        // gelapkan secukupnya supaya teks putih di tombol tetap terbaca.
        function pickAccent(img) {
            const n = 48;
            const c = Object.assign(document.createElement("canvas"), { width: n, height: n });
            const cx = c.getContext("2d");
            cx.drawImage(img, 0, 0, n, n);
            const px = cx.getImageData(0, 0, n, n).data;

            const bins = Array.from({ length: 12 }, () => ({ weight: 0, h: 0, s: 0, l: 0 }));
            for (let i = 0; i < px.length; i += 4) {
                if (px[i + 3] < 200) continue;
                const [h, s, l] = rgbToHsl(px[i], px[i + 1], px[i + 2]);
                if (s < 0.35 || l < 0.15 || l > 0.85) continue;
                const bin = bins[Math.floor(h * 12) % 12];
                bin.weight += s;
                bin.h += h * s; bin.s += s * s; bin.l += l * s;
            }
            const best = bins.reduce((a, b) => (b.weight > a.weight ? b : a));
            if (!best.weight) return null;
            const [h, s, l] = [best.h, best.s, best.l].map(v => v / best.weight);
            return `hsl(${Math.round(h * 360)} ${Math.round(Math.min(s, 0.85) * 100)}% ${Math.round(Math.min(l, 0.36) * 100)}%)`;
        }

        function rgbToHsl(r, g, b) {
            [r, g, b] = [r / 255, g / 255, b / 255];
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            const l = (max + min) / 2;
            if (!d) return [0, 0, l];
            const s = d / (1 - Math.abs(2 * l - 1));
            const h = max === r ? (g - b) / d + (g < b ? 6 : 0)
                    : max === g ? (b - r) / d + 2
                    : (r - g) / d + 4;
            return [h / 6, s, l];
        }

        async function loadTwibbon() {
            document.title = $("title").textContent = `Twibbon ${TWIBBON.title}`;
            try {
                frame = await loadImage(encodeURI(TWIBBON.src));
            } catch {
                return setStatus("Twibbon gagal dimuat. Coba muat ulang halaman.", true);
            }
            let accent = TWIBBON.accent;
            try {
                accent ||= pickAccent(frame);
            } catch {
                // Piksel tidak bisa dibaca (mis. dibuka via file://) — pakai warna bawaan
            }
            if (accent) document.documentElement.style.setProperty("--accent", accent);
            setStatus("Pilih foto, atau seret & lepas foto ke kotak di atas.");
            updateControls();
            draw();
        }

        // --- Foto pengguna ---
        async function loadPhoto(file) {
            if (!file?.type.startsWith("image/")) {
                return setStatus("File harus berupa gambar (JPG, PNG, dll).", true);
            }
            const url = URL.createObjectURL(file);
            try {
                const img = await loadImage(url);
                if (photo) URL.revokeObjectURL(photo.src);
                photo = img;
            } catch {
                URL.revokeObjectURL(url);
                return setStatus("Foto tidak bisa dibaca. Coba foto lain.", true);
            }
            fitScale = Math.max(SIZE / photo.naturalWidth, SIZE / photo.naturalHeight);
            resetView();
            stage.classList.add("has-photo");
            $("uploadText").textContent = "Ganti Foto";
            setStatus("Geser untuk memindahkan, scroll atau cubit (pinch) untuk zoom.");
            setStep(1);
            updateControls();
        }

        function resetView() {
            view.scale = fitScale;
            view.x = (SIZE - photo.naturalWidth * fitScale) / 2;
            view.y = (SIZE - photo.naturalHeight * fitScale) / 2;
            slider.value = zoomToSlider(1);
            draw();
        }

        // --- Zoom ---
        // Slider (0..1) dipetakan secara logaritmik ke MIN_ZOOM..MAX_ZOOM.
        const zoomToSlider = (zoom) => Math.log(zoom / MIN_ZOOM) / Math.log(MAX_ZOOM / MIN_ZOOM);
        const sliderToZoom = (t) => MIN_ZOOM * (MAX_ZOOM / MIN_ZOOM) ** t;

        // Zoom ke skala baru dengan titik `at` tetap di tempat
        function zoomTo(scale, at = CENTER) {
            if (!photo) return;
            scale = Math.min(fitScale * MAX_ZOOM, Math.max(fitScale * MIN_ZOOM, scale));
            const factor = scale / view.scale;
            view.x = at.x - (at.x - view.x) * factor;
            view.y = at.y - (at.y - view.y) * factor;
            view.scale = scale;
            slider.value = zoomToSlider(scale / fitScale);
            draw();
        }

        $("zoomInBtn").onclick = () => zoomTo(view.scale * ZOOM_STEP);
        $("zoomOutBtn").onclick = () => zoomTo(view.scale / ZOOM_STEP);
        slider.oninput = () => zoomTo(fitScale * sliderToZoom(+slider.value));

        canvas.addEventListener("wheel", (e) => {
            if (!photo) return;
            e.preventDefault();
            // ctrlKey = pinch di trackpad (delta kecil), selain itu scroll mouse
            zoomTo(view.scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), toCanvasPoint(e));
        }, { passive: false });

        // --- Geser & cubit (mouse, sentuh, pena) ---
        const pointers = new Map();
        let gesture = null;

        function toCanvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * SIZE / rect.width,
                y: (e.clientY - rect.top) * SIZE / rect.height
            };
        }

        // Pusat & jarak antar-jari (untuk satu jari: posisinya sendiri, jarak 0)
        function measure() {
            const [a, b = a] = pointers.values();
            return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, dist: Math.hypot(a.x - b.x, a.y - b.y) };
        }

        // Dipanggil setiap jumlah jari berubah supaya foto tidak "melompat"
        function restartGesture() {
            gesture = pointers.size ? measure() : null;
            stage.classList.toggle("dragging", !!gesture);
        }

        canvas.addEventListener("pointerdown", (e) => {
            if (!photo) return;
            canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, toCanvasPoint(e));
            restartGesture();
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, toCanvasPoint(e));
            const now = measure();
            view.x += now.x - gesture.x;
            view.y += now.y - gesture.y;
            if (pointers.size > 1 && gesture.dist) zoomTo(view.scale * now.dist / gesture.dist, now);
            else draw();
            gesture = now;
        });

        for (const type of ["pointerup", "pointercancel"]) {
            canvas.addEventListener(type, (e) => pointers.delete(e.pointerId) && restartGesture());
        }

        // --- Upload: tombol & seret-lepas ---
        $("uploadBtn").onclick = () => upload.click();
        upload.onchange = () => {
            loadPhoto(upload.files[0]);
            upload.value = ""; // agar file yang sama bisa dipilih lagi
        };

        for (const type of ["dragenter", "dragover", "dragleave", "drop"]) {
            stage.addEventListener(type, (e) => {
                e.preventDefault();
                stage.classList.toggle("drop-target", type === "dragenter" || type === "dragover");
                if (type === "drop") loadPhoto(e.dataTransfer.files[0]);
            });
        }

        $("resetBtn").onclick = resetView;

        // --- Unduh ---
        $("downloadBtn").onclick = () => {
            canvas.toBlob((blob) => {
                if (!blob) return setStatus("Gagal membuat gambar. Coba lagi.", true);
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Twibbon-${TWIBBON.title.replace(/\W+/g, "-")}.png`;
                link.click();
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                setStep(3);
                setStatus("Twibbon berhasil diunduh. Terima kasih! 🎉");
            }, "image/png");
        };

        loadTwibbon();
    </script>
</body>
</html>
